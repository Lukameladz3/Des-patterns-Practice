name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: false
        default: ""

jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Update snapshots
        env:
          USE_MOCK_DB: "true"
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Commit and push snapshot changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update visual test snapshots [skip ci]"
          file_pattern: "tests/**/*.png"

      - name: Upload snapshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: tests/**/*.png
          retention-days: 30
