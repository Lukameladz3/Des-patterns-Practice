name: Update Visual Test Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update snapshots on"
        required: false
        default: ""

jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Update snapshots
        env:
          USE_MOCK_DB: "true"
        run: npx playwright test tests/visual.spec.ts --update-snapshots

      - name: Debug - Check for changes
        run: |
          echo "Git status:"
          git status

      - name: Commit and push snapshot changes
        run: |
          # 1. Setup Git User
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. Add changes
          git add .

          # 3. Commit and Push if there are changes
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore: update visual test snapshots [skip ci]"
            # Push explicitly to the current branch
            git push origin HEAD:${{ github.ref_name }}
            echo "Changes pushed successfully."
          else
            echo "No changes to commit."
          fi

      - name: Upload snapshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: tests/**/*.png
          retention-days: 30
